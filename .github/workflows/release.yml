name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install local .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1
      - name: Install dependencies
        run: npm ci
      - name: Build portable executable
        run: npm run dist:win
      - name: Determine release tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            # Triggered by a tag push: always publish for that tag.
            $tag = "$env:GITHUB_REF_NAME"
            $publish = "true"
          } else {
            # Triggered from main or manually: publish v{version} from package.json.
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$version"
            $existing = git rev-parse -q --verify "refs/tags/$tag"
            if ($LASTEXITCODE -eq 0 -and $existing) {
              Write-Host "Tag $tag already exists - skipping release. Bump the version in package.json to publish a new release."
              $publish = "false"
            } else {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag $tag
              git push origin $tag
              $publish = "true"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: release/DSR-Randomizer.exe
